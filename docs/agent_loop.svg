<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A838"/></marker>
    <marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0aaa0"/></marker>
  </defs>
  <rect x="8" y="8" width="1384" height="934" fill="#242220" rx="26"/>

  <!-- ================= TOP GROUP: SELF-CORRECTION LOOP ================= -->
  <rect x="40" y="40" width="1320" height="370" fill="#2e2b28" stroke="#4a463f" stroke-width="2" rx="20"/>
  <text x="64" y="75" font-size="24" font-weight="bold" fill="#c9c3b8">SELF-CORRECTION LOOP — LangGraph</text>

  <rect x="70" y="100" width="330" height="110" fill="#0E9F7A" rx="14"/>
  <text x="86" y="132" font-size="25" font-weight="bold" fill="#ffffff">Extractor Agent</text>
  <text x="86" y="158" font-size="18" fill="#e6e0d6">runs Tiers 1–4 (below)</text>
  <text x="86" y="181" font-size="18" fill="#e6e0d6">fills URAR sections/fields</text>
  <text x="86" y="204" font-size="18" fill="#e6e0d6">per-field conf + source</text>

  <rect x="540" y="100" width="360" height="110" fill="#0E9F7A" rx="14"/>
  <text x="556" y="132" font-size="25" font-weight="bold" fill="#ffffff">Verifier Agent</text>
  <text x="556" y="158" font-size="18" fill="#e6e0d6">rule checks + LLM skepticism</text>
  <text x="556" y="181" font-size="18" fill="#e6e0d6">vision_recheck $0.05–0.10</text>
  <text x="556" y="204" font-size="18" fill="#e6e0d6">flags OCR + implausible values</text>

  <rect x="990" y="100" width="340" height="110" fill="#0E9F7A" rx="14"/>
  <text x="1006" y="132" font-size="25" font-weight="bold" fill="#ffffff">Corrector Agent</text>
  <text x="1006" y="158" font-size="18" fill="#e6e0d6">retry with DIFFERENT method</text>
  <text x="1006" y="181" font-size="18" fill="#e6e0d6">azure_di ↔ vision swap</text>
  <text x="1006" y="204" font-size="18" fill="#e6e0d6">e.g. OCR 'I995' → 1995</text>

  <rect x="70" y="255" width="330" height="110" fill="#B8842C" rx="14"/>
  <text x="86" y="287" font-size="25" font-weight="bold" fill="#ffffff">Result + Audit Trail</text>
  <text x="86" y="313" font-size="18" fill="#e6e0d6">agent_calls + field_history</text>
  <text x="86" y="336" font-size="18" fill="#e6e0d6">conf = min(avg, critical)</text>
  <text x="86" y="359" font-size="18" fill="#e6e0d6">low conf → needs_review</text>

  <rect x="540" y="255" width="360" height="110" fill="#6D5BD8" rx="14"/>
  <text x="556" y="287" font-size="25" font-weight="bold" fill="#ffffff">Route Decision</text>
  <text x="556" y="313" font-size="18" fill="#e6e0d6">all_plausible → END</text>
  <text x="556" y="336" font-size="18" fill="#e6e0d6">iter &lt; max(2) → corrector</text>
  <text x="556" y="359" font-size="18" fill="#e6e0d6">max reached → END + review</text>

  <line x1="400" y1="155" x2="536" y2="155" stroke="#E8A838" stroke-width="3" marker-end="url(#arrowP)"/>
  <text x="470" y="143" font-size="17" fill="#cfc9bf" text-anchor="middle">fields + conf</text>

  <line x1="720" y1="210" x2="720" y2="251" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#arrowI)"/>

  <path d="M900,310 H1160 V214" fill="none" stroke="#E8A838" stroke-width="3" marker-end="url(#arrowP)"/>
  <text x="935" y="298" font-size="17" fill="#cfc9bf">iter &lt; 2 → correct</text>

  <line x1="990" y1="155" x2="904" y2="155" stroke="#E8A838" stroke-width="3" marker-end="url(#arrowP)"/>
  <text x="945" y="143" font-size="17" fill="#cfc9bf" text-anchor="middle">re-verify</text>

  <line x1="540" y1="310" x2="404" y2="310" stroke="#E8A838" stroke-width="3" marker-end="url(#arrowP)"/>
  <text x="470" y="298" font-size="17" fill="#cfc9bf" text-anchor="middle">all_plausible</text>
  <text x="470" y="332" font-size="17" fill="#cfc9bf" text-anchor="middle">or max iter</text>

  <!-- ================= BOTTOM-LEFT GROUP: TIERED EXTRACTION ================= -->
  <rect x="40" y="440" width="900" height="360" fill="#2e2b28" stroke="#4a463f" stroke-width="2" rx="20"/>
  <text x="64" y="475" font-size="24" font-weight="bold" fill="#c9c3b8">TIERED EXTRACTION — inside the Extractor</text>

  <rect x="70" y="500" width="390" height="115" fill="#6D5BD8" rx="14"/>
  <text x="86" y="533" font-size="25" font-weight="bold" fill="#ffffff">Tier 1 — MISMO XML</text>
  <text x="86" y="560" font-size="18" fill="#e6e0d6">parsed fields → conf 1.0</text>
  <text x="86" y="583" font-size="18" fill="#e6e0d6">overall ≥ 0.95 → return as-is</text>
  <text x="86" y="606" font-size="18" fill="#e6e0d6">authoritative when present</text>

  <rect x="510" y="500" width="390" height="115" fill="#B34A3E" rx="14"/>
  <text x="526" y="533" font-size="25" font-weight="bold" fill="#ffffff">Tier 2 — Azure Doc Intel</text>
  <text x="526" y="560" font-size="18" fill="#e6e0d6">key-value pairs + table cells</text>
  <text x="526" y="583" font-size="18" fill="#e6e0d6">native per-field confidence</text>
  <text x="526" y="606" font-size="18" fill="#e6e0d6">merge only if conf improves</text>

  <rect x="70" y="655" width="390" height="115" fill="#B34A3E" rx="14"/>
  <text x="86" y="688" font-size="25" font-weight="bold" fill="#ffffff">Tier 3 — GPT-4o Vision</text>
  <text x="86" y="715" font-size="18" fill="#e6e0d6">targets low-conf + missing</text>
  <text x="86" y="738" font-size="18" fill="#e6e0d6">capped at 20 fields per pass</text>
  <text x="86" y="761" font-size="18" fill="#e6e0d6">self-reported conf 0.6–0.9</text>

  <rect x="510" y="655" width="390" height="115" fill="#0E9F7A" rx="14"/>
  <text x="526" y="688" font-size="25" font-weight="bold" fill="#ffffff">Tier 4 — Regex Fallback</text>
  <text x="526" y="715" font-size="18" fill="#e6e0d6">regex over tables.jsonl text</text>
  <text x="526" y="738" font-size="18" fill="#e6e0d6">only empty critical fields</text>
  <text x="526" y="761" font-size="18" fill="#e6e0d6">assigns conf 0.70–0.80</text>

  <line x1="460" y1="558" x2="506" y2="558" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#arrowI)"/>
  <line x1="705" y1="615" x2="273" y2="652" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#arrowI)"/>
  <text x="720" y="642" font-size="17" fill="#cfc9bf">gaps remain</text>
  <line x1="460" y1="712" x2="506" y2="712" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#arrowI)"/>

  <!-- ================= BOTTOM-RIGHT: CONFIDENCE GATES (numbers tiles) ================= -->
  <rect x="980" y="470" width="380" height="150" fill="#2e2b28" rx="20"/>
  <text x="1170" y="545" font-size="64" font-weight="bold" fill="#E8A838" text-anchor="middle">≥ 0.90</text>
  <text x="1170" y="580" font-size="20" fill="#cfc9bf" text-anchor="middle">critical-field gate</text>
  <text x="1170" y="606" font-size="15" fill="#8a847a" text-anchor="middle">addr · year · GLA · value · price · date</text>

  <rect x="980" y="650" width="380" height="150" fill="#2e2b28" rx="20"/>
  <text x="1170" y="725" font-size="64" font-weight="bold" fill="#E8A838" text-anchor="middle">2</text>
  <text x="1170" y="760" font-size="20" fill="#cfc9bf" text-anchor="middle">max corrector iterations</text>
  <text x="1170" y="786" font-size="15" fill="#8a847a" text-anchor="middle">then END with needs_review</text>

  <text x="1170" y="835" font-size="15" fill="#8a847a" text-anchor="middle">field_mappings.py · orchestrator.py</text>

  <!-- ================= LEGEND ================= -->
  <line x1="60" y1="865" x2="130" y2="865" stroke="#E8A838" stroke-width="3" marker-end="url(#arrowP)"/>
  <text x="140" y="871" font-size="17" fill="#cfc9bf">control flow</text>
  <line x1="330" y1="865" x2="400" y2="865" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#arrowI)"/>
  <text x="410" y="871" font-size="17" fill="#cfc9bf">fallback chain (merge best-confidence field wins)</text>
</svg>
